[package]
name = "ryha"
version = "0.1.0"
edition = "2021"

[lib]
name = "ryha"
path = "src/lib.rs"

[[bin]]
name = "ryha"
path = "src/main.rs"

[dependencies]
tempfile = "3.3.0"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8.5"
